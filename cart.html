<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Mysore Plants Nursery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .hidden { display: none; }
        
        /* Fade-in animation */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Success animation */
        .success-animation {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: url('https://via.placeholder.com/800') no-repeat center center;
            background-size: cover;
            animation: bounceIn 0.8s ease-in-out forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.7); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        .checkmark {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: green;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
        }

        /* Button animation */
        .animated-button:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-white shadow-md p-4">
        <ul class="flex justify-center space-x-4">
            <li><a href="index.html" class="text-green-700 font-bold">HOME</a></li>
            <li><a href="about.html" class="text-gray-700">ABOUT US</a></li>
            <li><a href="services.html" class="text-gray-700">SERVICES</a></li>
            <li><a href="contact.html" class="text-gray-700">CONTACT US</a></li>
            <li><a href="cart.html" class="text-gray-700 font-bold">🛒 CART</a></li>
        </ul>
    </nav>

    <!-- Checkout Items -->
    <div id="checkoutItems" class="container mx-auto mt-10 p-6 bg-white shadow-md rounded-lg fade-in">
        <h2 class="text-2xl font-bold text-green-700">Your Items</h2>
        <ul id="itemList" class="mt-4"></ul>
        <p class="mt-4 font-bold text-lg">Total: <span id="totalPrice">$0.00</span></p>
    </div>

    <!-- Checkout Form -->
    <div id="checkoutForm" class="container mx-auto mt-6 p-6 bg-white shadow-md rounded-lg fade-in">
        <h2 class="text-2xl font-bold text-green-700">Checkout Details</h2>
        <form class="mt-4" onsubmit="completePurchase(event)">
            <label class="block text-gray-700">Full Name</label>
            <input type="text" class="w-full p-2 border rounded mt-1" placeholder="Enter your full name" required>

            <label class="block text-gray-700 mt-4">Address</label>
            <textarea class="w-full p-2 border rounded mt-1" placeholder="Enter your address" required></textarea>

            <label class="block text-gray-700 mt-4">Phone Number</label>
            <input type="text" class="w-full p-2 border rounded mt-1" placeholder="Enter your phone number" required>

            <label class="block text-gray-700 mt-4">Payment Method</label>
            <select class="w-full p-2 border rounded mt-1">
                <option>Credit/Debit Card</option>
                <option>UPI</option>
                <option>Cash on Delivery</option>
            </select>

            <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-full mt-6 animated-button">Complete Purchase</button>
        </form>
    </div>

    <!-- Success Animation -->
    <div id="successPage" class="hidden success-animation">
        <div class="checkmark">✔</div>
        <h2 class="text-white text-2xl font-bold mt-4">Purchase Successful!</h2>
    </div>

    <script>
        // Dummy data for cart items with images
        const cartItems = [
            { name: "Aloe Vera Plant", price: 15.00, image: "https://via.placeholder.com/100" },
            { name: "Basil Plant", price: 12.50, image: "https://via.placeholder.com/100" },
            { name: "Snake Plant", price: 18.75, image: "https://via.placeholder.com/100" }
        ];

        function loadCartItems() {
            const itemList = document.getElementById("itemList");
            let total = 0;
            cartItems.forEach(item => {
                const li = document.createElement("li");
                li.classList.add("flex", "items-center", "space-x-4", "border-b", "p-2", "fade-in");
                
                const img = document.createElement("img");
                img.src = item.image;
                img.alt = item.name;
                img.classList.add("w-16", "h-16", "rounded");
                
                const details = document.createElement("div");
                details.innerHTML = `<p class='font-bold'>${item.name}</p><p>$${item.price.toFixed(2)}</p>`;
                
                li.appendChild(img);
                li.appendChild(details);
                itemList.appendChild(li);
                total += item.price;
            });
            document.getElementById("totalPrice").textContent = `$${total.toFixed(2)}`;
        }

        function completePurchase(event) {
            event.preventDefault();
            document.getElementById('checkoutForm').classList.add('hidden');
            document.getElementById('checkoutItems').classList.add('hidden');
            document.getElementById('successPage').classList.remove('hidden');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3000);
        }

        window.onload = loadCartItems;
    </script>

</body>
</html>
